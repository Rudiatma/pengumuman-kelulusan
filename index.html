<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengumuman Kelulusan</title>
  <script src="data.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f1f5f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.15rem;
    }
    p.subtitle {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 1.5rem;
    }
    input, button {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      background-color: #d4edda;
      border-left: 5px solid #28a745;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
    .not-found {
      background-color: #f8d7da;
      border-left: 5px solid #dc3545;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PENGUMUMAN KELULUSAN</h1>
    <h2>SMAN 1 MATAN HILIR UTARA</h2>
    <p class="subtitle">TAHUN PELAJARAN 2024/2025</p>
    <input type="text" id="nisn" placeholder="Masukkan NISN" />
    <input type="date" id="tanggal" placeholder="Tanggal Lahir" />
    <button onclick="cekKelulusan()">Cek Kelulusan</button>
    <div class="result" id="hasil"></div>
    <div class="not-found" id="tidakAda">Data tidak ditemukan. Periksa kembali NISN dan Tanggal Lahir.</div>
  </div>

  <script>
    function cekKelulusan() {
      const nisn = document.getElementById("nisn").value.trim();
      const tanggal = document.getElementById("tanggal").value;
      const hasil = document.getElementById("hasil");
      const tidakAda = document.getElementById("tidakAda");

      if (typeof siswa === 'undefined') {
        alert('Data siswa tidak ditemukan. Pastikan file data.js sudah terhubung.');
        return;
      }

      const siswaDitemukan = siswa.find(s => s.nisn === nisn && s.tanggal === tanggal);

      if (siswaDitemukan) {
        hasil.innerHTML = `
          <strong>Selamat ${siswaDitemukan.nama}!</strong><br>
          Anda dinyatakan <strong>${siswaDitemukan.keterangan}</strong>.<br><br>
          <em><strong>Tetap semangat dan terus berkarya!</strong></em>
        `;
        hasil.style.display = "block";
        tidakAda.style.display = "none";
      } else {
        hasil.style.display = "none";
        tidakAda.style.display = "block";
      }
    }
  </script>
</body>
</html>
